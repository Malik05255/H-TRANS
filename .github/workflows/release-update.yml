name: Publish Update

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $pkg = Get-Content package.json | ConvertFrom-Json
          "version=$($pkg.version)" >> $env:GITHUB_OUTPUT
          "tag=v$($pkg.version)" >> $env:GITHUB_OUTPUT

      - name: Check existing release
        id: existing
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Continue"
          & gh release view "${{ steps.version.outputs.tag }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            "exists=true" >> $env:GITHUB_OUTPUT
          } else {
            "exists=false" >> $env:GITHUB_OUTPUT
          }
          exit 0

      - uses: actions/setup-node@v4
        if: steps.existing.outputs.exists != 'true'
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@stable
        if: steps.existing.outputs.exists != 'true'

      - name: Download official Android Platform Tools
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "src-tauri\resources" | Out-Null
          Invoke-WebRequest "https://dl.google.com/android/repository/platform-tools-latest-windows.zip" -OutFile "src-tauri\resources\android-platform-tools.zip"

      - name: Download pinned scrcpy server
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        run: |
          $url = "https://github.com/Genymobile/scrcpy/releases/download/v3.3.4/scrcpy-server-v3.3.4"
          $out = "src-tauri\resources\scrcpy-server-v3.3.4"
          Invoke-WebRequest $url -OutFile $out
          $sha = (Get-FileHash $out -Algorithm SHA256).Hash.ToLower()
          if ($sha -ne "8588238c9a5a00aa542906b6ec7e6d5541d9ffb9b5d0f6e1bc0e365e2303079e") {
            throw "scrcpy-server SHA-256 verification failed: $sha"
          }

      - name: Generate H TRANS installer branding
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        run: .\src-tauri\windows\generate-installer-assets.ps1

      - name: Install dependencies
        if: steps.existing.outputs.exists != 'true'
        run: npm install

      - name: Build installer
        if: steps.existing.outputs.exists != 'true'
        run: npm run tauri build

      - name: Prepare release files
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          New-Item -ItemType Directory -Force "release" | Out-Null
          $source = Get-ChildItem "src-tauri\target\release\bundle\nsis\*.exe" | Select-Object -First 1
          $installer = "H-TRANS-$version-x64-setup.exe"
          Copy-Item $source.FullName "release\$installer" -Force
          $sha = (Get-FileHash "release\$installer" -Algorithm SHA256).Hash.ToLower()
          $url = "https://github.com/${{ github.repository }}/releases/download/v$version/$installer"
          $json = @{
            version = $version
            url = $url
            sha256 = $sha
          } | ConvertTo-Json
          Set-Content -Path "release\latest.json" -Value $json -Encoding utf8

      - name: Publish GitHub release
        if: steps.existing.outputs.exists != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $version = "${{ steps.version.outputs.version }}"
          $installer = "release\H-TRANS-$version-x64-setup.exe"

          for ($attempt = 1; $attempt -le 4; $attempt++) {
            gh release create $tag $installer "release\latest.json" --target "${{ github.sha }}" --title "H TRANS $version" --notes "نسخة H TRANS $version لنظام Windows."
            if ($LASTEXITCODE -eq 0) { exit 0 }

            Start-Sleep -Seconds (3 * $attempt)

            gh release view $tag *> $null
            if ($LASTEXITCODE -eq 0) {
              gh release upload $tag $installer "release\latest.json" --clobber
              if ($LASTEXITCODE -eq 0) { exit 0 }
            }
          }

          throw "Failed to publish H TRANS release after retries."
