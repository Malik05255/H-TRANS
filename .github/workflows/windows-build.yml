name: Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Download official Android Platform Tools
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\platform-tools.zip"
          $extract = "$env:RUNNER_TEMP\platform-tools"
          Invoke-WebRequest "https://dl.google.com/android/repository/platform-tools-latest-windows.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $extract -Force
          New-Item -ItemType Directory -Force "src-tauri\resources\platform-tools" | Out-Null
          Copy-Item "$extract\platform-tools\adb.exe" "src-tauri\resources\platform-tools\adb.exe" -Force
          Copy-Item "$extract\platform-tools\AdbWinApi.dll" "src-tauri\resources\platform-tools\AdbWinApi.dll" -Force
          Copy-Item "$extract\platform-tools\AdbWinUsbApi.dll" "src-tauri\resources\platform-tools\AdbWinUsbApi.dll" -Force

      - name: Install frontend dependencies
        run: npm install

      - name: Build H TRANS installer
        run: npm run tauri build

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: H-TRANS-Windows-Installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
