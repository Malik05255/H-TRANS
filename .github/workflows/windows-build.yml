name: Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Download official Android Platform Tools
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "src-tauri\resources" | Out-Null
          Invoke-WebRequest "https://dl.google.com/android/repository/platform-tools-latest-windows.zip" -OutFile "src-tauri\resources\android-platform-tools.zip"

      - name: Generate H TRANS installer branding
        shell: pwsh
        run: .\\src-tauri\\windows\\generate-installer-assets.ps1

      - name: Install frontend dependencies
        run: npm install

      - name: Build H TRANS installer
        run: npm run tauri build

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: H-TRANS-Windows-Installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
